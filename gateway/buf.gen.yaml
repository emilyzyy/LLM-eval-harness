version: v2
# Plugin versions are pinned so that regenerating produces identical files.
# CI regenerates and fails if the checked-in code differs.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go/capturepb
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.2
    out: gen/python
