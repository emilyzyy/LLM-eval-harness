[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "designops-eval"
version = "0.1.0"
description = "Cloud-ready LLM evaluation harness for CAD design-assistant workflows"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
cohere = [
    "cohere>=5.0",
]
dev = [
    "pytest>=8.0",
    "moto[all,server]>=5.0",
]

[project.scripts]
designops-eval = "designops_eval.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
